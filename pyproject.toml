[project]
name = "stateforward.hsm"
version = "0.5.16"
description = "Hierarchical State Machine implementation for Python with asyncio support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [
    {name = "Stateforward Team"},
]
keywords = ["state-machine", "hsm", "finite-state-machine", "hierarchical", "asyncio", "async"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/stateforward/hsm"
Repository = "https://github.com/stateforward/hsm.py"
Documentation = "https://github.com/stateforward/hsm.py#readme"
Issues = "https://github.com/stateforward/hsm.py/issues"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "strict"
timeout = 30
timeout_method = "thread"
pythonpath = [
    "."
]
testpaths = [
    "tests"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hsm"]

[dependency-groups]
dev = [
    "hypothesis>=6.136.0",
    "pip-audit>=2.9.0",
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "pyright>=1.1.407",
    "scalene>=1.5.51",
    "wheel>=0.46.2",
    "yappi>=1.6.10",
]
